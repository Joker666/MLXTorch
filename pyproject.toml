[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxtorch"
version = "0.1.0"
description = "Minimal MLX-based deep learning framework inspired by PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MLXTorch Team" }
]
dependencies = [
  "mlx>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/Joker666/mlxtorch"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlxtorch*"]